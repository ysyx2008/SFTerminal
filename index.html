<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http: https: data: blob:;">
    <title>旗鱼</title>
    <script>
      // ⚡ FOUC 防护：在 Vue 挂载前把上次使用的 UI 主题同步到 <html>，
      // 避免首帧用默认主题 (dark) 与用户实际选择不一致而出现一闪而过的色差。
      // 缓存 key 需与 src/stores/config.ts 中的 UI_THEME_STORAGE_KEY 保持一致。
      (function () {
        try {
          var theme = localStorage.getItem('sfterm-ui-theme')
          var scheme = localStorage.getItem('sfterm-ui-color-scheme')
          if (theme) document.documentElement.setAttribute('data-ui-theme', theme)
          if (scheme) document.documentElement.setAttribute('data-color-scheme', scheme)
        } catch (e) { /* localStorage 不可用时让 :root 兜底 */ }
      })()
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* 启动时 main.css 尚未加载，用 :root 的 bg-primary 兜底（dark 配色 #181818），
         避免沿用纯黑导致的黑→蓝→目标主题二次闪烁。 */
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-primary, #181818);
      }

      /* 启动占位（boot splash）：低配 Windows 上 Vite bundle 解析 + Vue mount
         可能要 5~15 秒才完成首屏 paint。期间窗口已经被主进程兜底 show 出来，
         如果不放任何内容用户会看到长时间空白。这里渲染一个轻量加载屏，
         Vue mount 时会自动替换 #app 内的 innerHTML，splash 自动消失。

         关键：用 fade-in + 600ms 延迟，让高配机器（mac / 高配 Win）感受不到 splash：
         - 高配机器：Vue 通常 300~500ms 内 mount 完成 → 600ms 延迟内 splash 还没显现
           就被替换，体验上跟"直接出 UI"一致
         - 低配机器：webContents 首屏要 5~10s，600ms 后 splash 平滑淡入，
           用户看到加载屏比看到长时间空白友好得多 */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-primary, #181818);
        color: rgba(255, 255, 255, 0.55);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        user-select: none;
        -webkit-user-select: none;
        opacity: 0;
        animation: boot-splash-fade-in 0.4s ease-out 0.6s forwards;
      }
      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .boot-splash__spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        animation: boot-splash-spin 0.9s linear infinite;
      }
      @keyframes boot-splash-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-splash-fade-in {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash__inner">
          <div class="boot-splash__spinner"></div>
          <div>正在启动 / Loading…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
