name: Protect Main Branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  check-source-branch:
    name: Check PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is develop or hotfix
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Source branch: $SOURCE_BRANCH"

          if [ "$SOURCE_BRANCH" = "develop" ] || [[ "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "✅ Source branch '$SOURCE_BRANCH' is allowed."
            exit 0
          fi

          echo "❌ Error: Pull requests to 'main' must come from 'develop' or 'hotfix/*'."
          echo ""
          echo "Current source branch: $SOURCE_BRANCH"
          echo ""
          echo "常规发版: 先合进 develop，再从 develop 发版（或 PR 到 main）。"
          echo "热修: 从已发布的 tag 拉 hotfix/x.y.z，发完会自动合回 develop。"
          exit 1

