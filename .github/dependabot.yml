# Dependabot 配置
#
# Git Flow：develop 开发 → main 发版
# - 版本更新（下方 schedule）：target-branch: develop ✅
# - 安全更新（Dependabot alerts）：只能打仓库「默认分支」⚠️
#   → 仓库默认分支已设为 develop，安全 PR 会直达 develop
#   → 若仍出现指向 main 的安全 PR，由 retarget-dependabot-to-develop.yml 自动改基线
#
# 注意：package-ecosystem 配置了 target-branch 时，该 ecosystem 的 security PR
# 不会继承 labels/assignees 等选项（GitHub 平台行为），但仍会打到默认分支。

version: 2
updates:

  # npm 依赖
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "npm"
    # 控制 PR 数量，避免过多
    open-pull-requests-limit: 5
    # 每次只升一个包（减少冲突）
    pull-request-branch-name:
      separator: "/"
    # 只升级 patch 和 minor，不自动升 major
    versioning-strategy: increase-if-necessary
    # 允许 Dependabot 自动合并 patch 版本的安全更新
    allow:
      - dependency-type: "production"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-type: "development"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  # Website (Astro) 依赖
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "website"
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: "production"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-type: "development"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
