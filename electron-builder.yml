# ⚠️ [高风险配置] 应用标识符
# 如果 macOS 打包后 SSH 连接失败，尝试改回旧值排查
# 安全回退值：appId: com.qiyu.terminal, productName: 旗鱼
appId: com.sfterm.terminal
productName: SailFish
protocols:
  - name: "SailFish Protocol"
    schemes:
      - sailfish
# ⚠️ [高风险配置] macOS 本地化应用名称修复钩子
# 如果 macOS 打包后 SSH 连接失败，请先删除此行排查
# 安全回退值：删除整行 afterPack
afterPack: ./scripts/afterPack.js
directories:
  buildResources: resources
  output: release
# 自动更新配置
publish:
  provider: github
  owner: ysyx2008
  repo: SailFish
# 构建加速配置
electronDownload:
  cache: ./electron-cache
buildDependenciesFromSource: false
nodeGypRebuild: false
files:
  - dist
  - dist-electron
asarUnpack:
  - node_modules/@homebridge/node-pty-prebuilt-multiarch/**/*
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-darwin-*/**/*
  - node_modules/sherpa-onnx-linux-*/**/*
  - node_modules/sherpa-onnx-win-*/**/*
  - node_modules/onnxruntime-node/**/*
  - "**/onnxruntime-node/**/*"
  - dist-electron/services/speech/**/*
  - dist-electron/services/pdf-worker.js
  - dist-electron/services/knowledge/**/*
  - node_modules/@xenova/transformers/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-*/**/*
  # sharp 是 native 模块，运行时按平台动态 require
  # build/Release/sharp-{platform}-{arch}.node，必须保留在文件系统而不是 asar 内
  - node_modules/sharp/**/*
  - node_modules/@img/sharp-*/**/*
# 启用最大压缩率以减小安装包大小（会增加打包时间）
# compression: maximum
extraResources:
  # 系统托盘图标（运行时加载）
  - from: "resources/icon_trayTemplate.png"
    to: "icon_trayTemplate.png"
  - from: "resources/icon_trayTemplate@2x.png"
    to: "icon_trayTemplate@2x.png"
  - from: "resources/icon.png"
    to: "icon.png"
  # IM 平台配置指南（供 Agent 读取）
  - from: "docs/messaging"
    to: "docs/messaging"
    filter:
      - "**/*.md"
  # 轻量 Embedding 模型（随软件打包）
  - from: "resources/models/embedding/bge-small-zh-v1.5"
    to: "models/embedding/bge-small-zh-v1.5"
    filter:
      - "**/*"
  # Paraformer 语音识别模型（随软件打包）
  - from: "resources/models/speech/paraformer"
    to: "models/speech/paraformer"
    filter:
      - "**/*"
  # CT-Transformer 标点恢复模型（随软件打包）
  - from: "resources/models/speech/punctuation"
    to: "models/speech/punctuation"
    filter:
      - "**/*"
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # Everything 便携版（仅 Windows）- 用于快速文件搜索
  extraResources:
    - from: "resources/everything"
      to: "everything"
      filter:
        - "**/*.exe"
        - "**/*.dll"
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 旗鱼
  include: resources/nsis/vcredist-install.nsh
  # 多语言安装程序
  installerLanguages:
    - en_US
    - zh_CN
  language: 2052
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    # zip 文件是自动更新必需的（Squirrel.Mac 需要 zip 而非 dmg）
#    - target: zip
#      arch:
#        - x64
#        - arm64
  # ⚠️ [高风险配置] 本地化应用名称支持
  # 如果 macOS 打包后 SSH 连接失败，请删除下方 extraFiles 和 extendInfo 整块配置
  # 安全回退：只保留上面的 icon 和 target
  extraFiles:
    - from: "resources/zh-Hans.lproj"
      to: "Resources/zh-Hans.lproj"
    - from: "resources/en.lproj"
      to: "Resources/en.lproj"
  extendInfo:
    # 不设置 CFBundleDisplayName，让系统从 InfoPlist.strings 读取本地化名称
    CFBundleDevelopmentRegion: en
    LSHasLocalizedDisplayName: true
    CFBundleLocalizations:
      - en
      - zh_CN
      - zh-Hans
    # macOS 14+ 本地网络访问授权说明（SSH/SFTP 连接局域网主机必需）
    # 缺失此 key 会导致 macOS 静默拒绝本地网络访问且不弹授权弹窗，表现为 EHOSTUNREACH
    NSLocalNetworkUsageDescription: "SailFish 需要访问本地网络以连接 SSH/SFTP 服务器、虚拟机及局域网设备。"
    # 麦克风访问授权说明（语音识别 / 语音输入功能必需）
    # macOS TCC 在首次调用 getUserMedia 时会读取此 key 作为弹窗文案；
    # 缺失会被系统静默拒绝授权。
    NSMicrophoneUsageDescription: "SailFish 需要访问麦克风以提供语音输入和语音识别功能。"
dmg:
  # DMG 窗口配置
  window:
    width: 660
    height: 500
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications
    - x: 230
      y: 370
      type: file
      path: resources/dmg/Installation Guide.txt
    - x: 430
      y: 370
      type: file
      path: resources/dmg/安装说明.txt
linux:
  icon: resources
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  # 本地化应用名称支持
  executableName: sfterm
  desktop:
    entry:
      Name: SailFish
      Name[zh_CN]: 旗鱼
      Comment: AI-Powered Smart Assistant
      Comment[zh_CN]: AI 驱动的智能助手

