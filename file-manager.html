<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' http: https: file:;">
    <title>File Manager</title>
    <script>
      // ⚡ FOUC 防护：同主窗口 index.html 逻辑，在 Vue 挂载前同步 <html> 主题属性。
      // 跟随系统模式下直接根据 prefers-color-scheme 选择 dark/light。
      (function () {
        try {
          var mode = localStorage.getItem('sfterm-ui-theme-mode')
          var theme, scheme
          if (mode === 'auto') {
            var prefersDark = window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches
            theme = prefersDark ? 'dark' : 'light'
            scheme = prefersDark ? 'dark' : 'light'
          } else {
            theme = localStorage.getItem('sfterm-ui-theme')
            scheme = localStorage.getItem('sfterm-ui-color-scheme')
          }
          if (theme) document.documentElement.setAttribute('data-ui-theme', theme)
          if (scheme) document.documentElement.setAttribute('data-color-scheme', scheme)
        } catch (e) { /* localStorage 不可用时让 :root 兜底 */ }
      })()
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* 启动时 main.css 尚未加载，用 :root 的 bg-primary 兜底（dark 配色 #181818） */
      body {
        background: var(--bg-primary, #181818);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/file-manager-main.ts"></script>
  </body>
</html>
